apiVersion: v1
kind: Namespace
metadata:
  name: dike-system
  labels:
    app.kubernetes.io/name: dike
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dike-controller-manager
  namespace: dike-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: dike-manager-role
rules:
  # Read CAPI Cluster objects for tenant discovery
  - apiGroups: ["cluster.x-k8s.io"]
    resources: ["clusters"]
    verbs: ["get", "list", "watch"]
  # Read kubeconfig Secrets
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
  # Leader election
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Events
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: dike-manager-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: dike-manager-role
subjects:
  - kind: ServiceAccount
    name: dike-controller-manager
    namespace: dike-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dike-controller-manager
  namespace: dike-system
  labels:
    app.kubernetes.io/name: dike
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dike
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dike
    spec:
      serviceAccountName: dike-controller-manager
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          image: zot.rpcu.io/public/dike:latest
          imagePullPolicy: IfNotPresent
          command:
            - /manager
          args:
            - --leader-elect
            - --health-probe-bind-address=:8081
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - "ALL"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            limits:
              cpu: 500m
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 64Mi
      terminationGracePeriodSeconds: 10
